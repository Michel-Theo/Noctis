# NOCTIS — site Apache (VPS PulseHeberg, Debian 12)
# Le front (build Vite) est servi en statique ; /api part vers Symfony par PHP-FPM 8.4.
# Le HTTPS (bloc *:443) est ajouté par certbot dans noctis-le-ssl.conf.
<VirtualHost *:80>
    ServerName noctis.mmi24e13.mmi-troyes.fr
    DocumentRoot /var/www/noctis/front

    <Directory /var/www/noctis/front>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Application monopage : toute route inconnue renvoie index.html.
        FallbackResource /index.html
    </Directory>

    # API Symfony : tout /api est confié au contrôleur frontal, qui lit l'URL d'origine.
    <Location /api>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </Location>
    ProxyFCGISetEnvIf "reqenv('REQUEST_URI') =~ m#^/api#" SCRIPT_FILENAME "/var/www/noctis/back/public/index.php"
    ProxyFCGISetEnvIf "reqenv('REQUEST_URI') =~ m#^/api#" SCRIPT_NAME "/index.php"

    # Fichiers versionnés par Vite : cache long ; index.html jamais mis en cache.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/noctis-error.log
    CustomLog ${APACHE_LOG_DIR}/noctis-access.log combined
</VirtualHost>
