framework:
    rate_limiter:
        # Formulaire de contact : 3 messages par tranche de 10 minutes et par adresse IP.
        contact:
            policy: sliding_window
            limit: 3
            interval: '10 minutes'
        # Mot de passe oublié : 3 demandes par tranche de 15 minutes et par adresse IP.
        forgot:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
