security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # Comptes clients : session par cookie (SameSite=Lax), même domaine que le front.
        main:
            lazy: true
            provider: app_users
            entry_point: App\Security\JsonEntryPoint
            access_denied_handler: App\Security\JsonAccessDeniedHandler
            json_login:
                check_path: api_auth_login
                username_path: email
                password_path: password
                success_handler: App\Security\JsonLoginHandler
                failure_handler: App\Security\JsonLoginHandler
            # 5 essais par minute (par e-mail + IP), puis 429.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            # « Rester connecté » : le JSON de connexion contient "remember": true.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 31536000
                remember_me_parameter: remember
            logout:
                path: api_auth_logout

    access_control:
        - { path: ^/api/me, roles: ROLE_USER }
        - { path: ^/api/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Hachage volontairement rapide en test.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
